name: Apply membership checkout flow

on:
  push:
    paths:
      - '.github/workflows/apply-membership-checkout-flow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply checkout patch
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          encoded = """"""
          Path('/tmp/brandthat-checkout.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          git apply --check /tmp/brandthat-checkout.patch
          git apply /tmp/brandthat-checkout.patch
      - name: Test and build
        working-directory: brandthat-ai-full-project
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit checkout fix
        run: |
          rm .github/workflows/apply-membership-checkout-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brandthat-ai-full-project/src/App.jsx brandthat-ai-full-project/netlify/functions/create-checkout-session.js brandthat-ai-full-project/scripts/test-checkout-handler.mjs .github/workflows/apply-membership-checkout-flow.yml
          git commit -m "Centralize membership checkout flow"
          git push origin HEAD:main
