name: Apply BrandThat patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-brandthat-fix.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply BrandThat fix patch
        env:
          PATCH_B64: >-
            
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path
          data = os.environ["PATCH_B64"].strip()
          patch = gzip.decompress(base64.b64decode(data))
          Path("/tmp/brandthat-latest.patch").write_bytes(patch)
          print(f"Wrote patch with {len(patch)} bytes")
          PY
          git apply --index /tmp/brandthat-latest.patch
          rm .github/workflows/apply-brandthat-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix membership checkout and preview isolation"
          git push
